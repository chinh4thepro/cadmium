name: Install dependencies

runs:
  using: composite
  steps:
    - name: Install dependencies
      run: |
        echo "deb-src http://azure.archive.ubuntu.com/ubuntu/ $(lsb_release -c -s) main universe restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb-src http://azure.archive.ubuntu.com/ubuntu/ $(lsb_release -c -s)-updates main universe restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb-src http://azure.archive.ubuntu.com/ubuntu/ $(lsb_release -c -s)-security main universe restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb-src http://azure.archive.ubuntu.com/ubuntu/ $(lsb_release -c -s)-backports main universe restricted" | sudo tee -a /etc/apt/sources.list
        sudo apt update
        sudo apt build-dep linux
        sudo apt install libarchive-tools curl wget f2fs-tools cgpt vboot-utils libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf qemu-user-static lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu llvm clang u-boot-tools debootstrap
