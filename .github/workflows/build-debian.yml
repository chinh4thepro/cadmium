name: Build Image (Debian)

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:      
      - name: Build image
        run: |
          env RELEASE=arm64-chromebook ./build-all ./cadmium-arm64-chromebook.img 8G
          
      - name: Upload Images  
        uses: actions/upload-artifact@v5
        with:
          name: installer-images
          path: cadmium-*.img
